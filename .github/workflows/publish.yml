name: Publish

# Push a tag like v1.0.1 and the mod is built and uploaded to CurseForge (and to Modrinth once MODRINTH_ID and
# MODRINTH_TOKEN are set), with a GitHub release carrying the same jar. The version must match gradle.properties,
# and CHANGELOG.md must have a "## <version>" section: it becomes the changelog on every site.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KaiNrav/remnants-of-the-past-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Version and changelog
        id: meta
        run: |
          full=$(grep '^version=' gradle.properties | cut -d= -f2)
          version=${full%%+*}
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in gradle.properties" >&2
            exit 1
          fi
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > build-changelog.md
          if [ ! -s build-changelog.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-configuration-cache

      - name: Upload
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.full }}
          version-type: release
          changelog-file: build-changelog.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
